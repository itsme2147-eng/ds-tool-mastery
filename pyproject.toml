[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit"
version = "0.1.0"
description = "Reusable data-science utilities: transformers, evaluation and a reproducible training CLI"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "scipy", "lightgbm", "joblib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
